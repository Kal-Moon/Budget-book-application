# 코드를 올릴 때마다 검사·테스트를 하고, 폰에 바로 설치할 수 있는 APK를 만든다.
# 만든 APK는 Releases의 "dev-latest"(최신 테스트 빌드)에 올라간다.
# 출시 형식(AAB)도 함께 빌드해서 스토어 다운로드 크기를 확인한다.
name: Android 테스트 빌드

on:
  push:
    branches: ['main', 'claude/**']
    paths-ignore: ['**.md', 'reference/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: 패키지 받기
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze

      # 테스트는 GitHub에서 SQLite 바이너리를 받지 않고 러너에 설치된 시스템 SQLite를 쓴다.
      # (pubspec에 임시로 설정을 붙였다가 테스트 후 원래대로 되돌린다. APK 빌드에는 쓰지 않는다.)
      - name: 테스트
        run: |
          sudo apt-get install -y libsqlite3-dev >/dev/null
          cp pubspec.yaml /tmp/pubspec.yaml
          printf '\nhooks:\n  user_defines:\n    sqlite3:\n      source: system\n' >> pubspec.yaml
          status=0; flutter test || status=$?
          cp /tmp/pubspec.yaml pubspec.yaml
          exit $status

      # 출시 빌드와 같은 옵션으로 만든다: 코드 난독화 + 디버그 정보 분리(앱이 작아진다).
      # 분리한 디버그 정보(build/symbols)는 오류 보고를 읽을 때 필요해서 아래에서 보관한다.
      # 테스트 APK는 arm64(2017년 이후 거의 모든 폰) 한 벌만 넣는다. 세 벌을 다 넣으면 100MB가 된다.
      # Gradle 배포 파일·SQLite 바이너리를 GitHub에서 받다가 일시적으로 실패하는 경우가 있어 5번까지 다시 시도한다.
      - name: APK 빌드
        env:
          GAGYEBU_ARM64_ONLY: 'true'
        run: |
          for i in 1 2 3 4 5; do
            flutter build apk --release --build-number=${{ github.run_number }} \
              --target-platform android-arm64 \
              --obfuscate --split-debug-info=build/symbols && exit 0
            echo "빌드 실패 ($i/5), 60초 후 다시 시도"; sleep 60
          done
          exit 1

      # Play 스토어에 올리는 형식(AAB). 모든 폰 종류를 넣고, 스토어가 폰마다 한 벌만 골라 보낸다.
      # 여기서는 출시 빌드가 되는지와 스토어 다운로드 크기를 확인하는 용도다.
      # (테스트 키로 서명돼 있어 스토어에 그대로 올릴 수는 없다. 업로드 키는 커밋하지 않는다.)
      # 실패해도 테스트 APK 배포는 막지 않는다.
      - name: 출시용 AAB 빌드
        id: aab
        continue-on-error: true
        run: |
          flutter build appbundle --release --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/symbols

      - name: 스토어 다운로드 크기 계산
        id: size
        if: steps.aab.outcome == 'success'
        continue-on-error: true
        run: |
          curl -sSfL -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab --output=app.apks \
            --ks=android/app/dev.keystore --ks-pass=pass:gagyebu-dev \
            --ks-key-alias=dev --key-pass=pass:gagyebu-dev
          java -jar bundletool.jar get-size total --apks=app.apks --dimensions=ABI > size.csv
          cat size.csv
          # 바이트를 MB로 바꿔 Releases 설명에 넣는다.
          awk -F, '{sub(/\r$/,"")} NR==1{print;next}{for(i=1;i<=NF;i++) if($i ~ /^[0-9]+$/ && $i>100000) $i=sprintf("%.1fMB",$i/1000000); print}' OFS=, size.csv > size-mb.csv

      - name: Releases의 dev-latest에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk gagyebu-dev.apk
          apk_mb=$(awk "BEGIN{printf \"%.1f\", $(stat -c%s gagyebu-dev.apk)/1000000}")
          if [ -f size-mb.csv ]; then
            store="Play 스토어 예상 다운로드 크기(폰 종류별 최소,최대):
          $(cat size-mb.csv)"
          elif [ "${{ steps.aab.outcome }}" = "success" ]; then
            store="출시용 AAB는 만들어졌지만 스토어 크기 계산은 실패했어요."
          else
            store="⚠️ 출시용 AAB 빌드가 실패했어요. Actions 로그를 확인해야 해요."
          fi
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release create dev-latest gagyebu-dev.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "최신 테스트 빌드 (빌드 ${{ github.run_number }})" \
            --notes "브랜치: ${{ github.ref_name }}
          커밋: ${{ github.sha }}
          앱의 설정 화면 아래쪽 버전이 1.0.0+${{ github.run_number }}이면 이 빌드예요.
          테스트 APK: ${apk_mb}MB (arm64 폰용)

          ${store}"

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: gagyebu-dev-apk
          path: gagyebu-dev.apk
          retention-days: 14

      # 출시용 AAB와 난독화 해제용 디버그 정보. 스토어 오류 보고를 읽을 때 같은 빌드의 것이 필요하다.
      - name: 출시용 AAB·디버그 정보 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gagyebu-release-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols
          if-no-files-found: ignore
          retention-days: 30
