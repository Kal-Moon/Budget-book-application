name: gagyebu
description: "예산을 먼저 정하고, 그 안에서 지출을 관리하는 가계부"
publish_to: 'none'

# 빌드 번호(+N)는 CI가 --build-number로 실행 번호를 넣는다.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  fl_chart: ^1.3.1
  excel: ^4.0.6
  csv: ^8.0.0
  file_picker: ^13.3.3
  cp949_codec: ^1.0.2
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  crypto: ^3.0.8
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
